<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Викторина!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: rgba(16, 20, 29, 0.90);
      --surface-elevated: rgba(25, 31, 44, 0.94);
      --border: rgba(128, 144, 178, 0.28);
      --text: #f2f5fa;
      --text-muted: #b0bccf;
      --accent: #6b5dd7;
      --accent-soft: rgba(107, 93, 215, 0.18);
      --accent-border: rgba(107, 93, 215, 0.55);
      --valera-score: #e5a93c;
      --teal: #4ecdc4;
      --green: #38b778;
      --green-surface: rgba(21, 58, 43, 0.94);
      --red: #e05a5a;
      --red-soft: rgba(224, 90, 90, 0.22);
      --radius: 22px;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.8vh 3.4vw 2.6vh;
      background: transparent !important;
      gap: 2vh;
    }

    /* Верхняя панель */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2vw;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.75vw;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      padding: 1.25vh 2.1vw;
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(24px, 2.05vw, 42px);
      font-weight: 800;
      letter-spacing: 0.01em;
      color: var(--accent);
      line-height: 1.1;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1vh 2.1vw;
      gap: 1.5vw;
      box-shadow: var(--shadow);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .player-name {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(22px, 1.9vw, 38px);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .player-score {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(32px, 2.75vw, 56px);
      font-weight: 800;
      min-width: 2.1ch;
      text-align: center;
      padding: 0.35vh 0.85vw;
      border-radius: 14px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      line-height: 1.05;
    }

    .player-score.valera { color: var(--valera-score); }
    .player-score.alex { color: var(--teal); }

    .score-sep {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(26px, 2.2vw, 44px);
      color: var(--text-muted);
      font-weight: 700;
    }

    .vabank-pill {
      display: none;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(14px, 1.05vw, 22px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.55vh 0.9vw;
      border-radius: 999px;
      background: var(--red-soft);
      color: #ff9494;
      border: 1px solid rgba(224, 90, 90, 0.55);
    }

    .vabank-pill.active {
      display: inline-block;
    }

    /* Центральная область */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .standby-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .standby-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2.4vh;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      border-radius: 30px;
      padding: 5.5vh 5vw;
      max-width: 78vw;
      box-shadow: var(--shadow);
    }

    .standby-badge {
      padding: 0.9vh 1.8vw;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-family: 'Rubik', sans-serif;
      font-size: clamp(18px, 1.35vw, 27px);
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .standby-title {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(54px, 5.8vw, 114px);
      font-weight: 800;
      line-height: 1.05;
      color: var(--text);
    }

    .standby-sub {
      font-size: clamp(22px, 1.95vw, 38px);
      color: var(--text-muted);
      max-width: 62vw;
      line-height: 1.38;
      font-weight: 500;
    }

    .standby-meta {
      margin-top: 0.6vh;
      font-size: clamp(18px, 1.35vw, 26px);
      color: var(--text-muted);
      padding: 1vh 1.8vw;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-weight: 500;
    }

    /* Экран вопроса */
    .quiz-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 2vh;
      height: 100%;
    }

    .quiz-screen.active {
      display: flex;
    }

    .standby-screen.hidden {
      display: none;
    }

    .question-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.3vh 2.4vw;
      display: flex;
      flex-direction: column;
      gap: 1.4vh;
      box-shadow: var(--shadow);
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.7vh 1.35vw;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-family: 'Rubik', sans-serif;
      font-size: clamp(16px, 1.25vw, 25px);
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .question-text {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(30px, 2.85vw, 56px);
      font-weight: 700;
      line-height: 1.22;
      color: var(--text);
    }

    .question-text.long {
      font-size: clamp(25px, 2.3vw, 45px);
      line-height: 1.24;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8vh 1.6vw;
    }

    .option-card {
      display: flex;
      align-items: center;
      gap: 1.35vw;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 2.1vh 1.7vw;
      min-height: 14vh;
      box-shadow: var(--shadow);
      transition: all 0.28s ease;
    }

    .option-num {
      flex-shrink: 0;
      width: clamp(56px, 4.3vw, 84px);
      height: clamp(56px, 4.3vw, 84px);
      border-radius: 16px;
      background: var(--surface-elevated);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(28px, 2.5vw, 48px);
      font-weight: 800;
      color: var(--accent);
      transition: all 0.28s ease;
    }

    .option-content {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .option-main {
      font-size: clamp(22px, 1.95vw, 38px);
      font-weight: 700;
      line-height: 1.22;
      color: var(--text);
      word-wrap: break-word;
    }

    .option-main.long {
      font-size: clamp(19px, 1.55vw, 30px);
      line-height: 1.24;
    }

    .option-sub {
      font-size: clamp(17px, 1.35vw, 26px);
      color: var(--text-muted);
      line-height: 1.25;
      font-weight: 500;
    }

    .option-sub.long {
      font-size: clamp(15px, 1.15vw, 22px);
      line-height: 1.25;
    }

    .option-card.correct {
      background: var(--green-surface);
      border-color: var(--green);
      box-shadow: 0 0 34px rgba(56, 183, 120, 0.3);
      transform: scale(1.01);
    }

    .option-card.correct .option-num {
      background: var(--green);
      color: #0b1610;
      border-color: var(--green);
    }

    .option-card.dimmed {
      opacity: 0.36;
    }

    .explanation-box {
      display: none;
      background: var(--surface-elevated);
      border: 1px solid rgba(56, 183, 120, 0.4);
      border-left: 6px solid var(--green);
      border-radius: 16px;
      padding: 1.7vh 1.8vw;
      font-size: clamp(19px, 1.55vw, 30px);
      line-height: 1.36;
      color: #e4ebf5;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease;
    }

    .explanation-box.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Нижняя полоса таймера */
    .footer-bar {
      display: flex;
      align-items: center;
      gap: 1.6vw;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.35vh 1.9vw;
      box-shadow: var(--shadow);
    }

    .timer-track {
      flex: 1;
      height: 18px;
      background: rgba(10, 13, 20, 0.85);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.12s linear;
    }

    .timer-digits {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(28px, 2.3vw, 46px);
      font-weight: 800;
      min-width: 2.8ch;
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .timer-digits.danger {
      color: var(--red);
    }

    .fingers-alert {
      display: none;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(22px, 1.8vw, 36px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      animation: pulse 0.75s infinite alternate;
      white-space: nowrap;
    }

    .fingers-alert.visible {
      display: inline-block;
    }

    @keyframes pulse {
      from { opacity: 0.65; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="topbar">
      <div class="brand-pill">
        <div class="brand-title">Викторина • <span id="seasonLabel">Зимний кубок</span></div>
      </div>

      <div class="scoreboard">
        <div class="player">
          <span class="vabank-pill" id="vbPillValera">Ва-банк</span>
          <span class="player-name">Валерий</span>
          <span class="player-score valera" id="scoreValera">0</span>
        </div>
        <span class="score-sep">:</span>
        <div class="player">
          <span class="player-score alex" id="scoreAlex">0</span>
          <span class="player-name">Алекс</span>
          <span class="vabank-pill" id="vbPillAlex">Ва-банк</span>
        </div>
      </div>
    </header>

    <main class="main-area">
      <section class="standby-screen" id="standbyScreen">
        <div class="standby-card">
          <div class="standby-badge">Эфирная пауза</div>
          <h1 class="standby-title">Викторина!</h1>
          <p class="standby-sub">Четыре варианта, один таймер и одновременный ответ в камеру.</p>
          <div class="standby-meta" id="bankStatsText">Подключение к таблице...</div>
        </div>
      </section>

      <section class="quiz-screen" id="quizScreen">
        <div class="question-box">
          <div class="question-header">
            <span class="category-badge" id="categoryBadge">ВИКТОРИНА</span>
          </div>
          <h2 class="question-text" id="questionText"></h2>
        </div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="explanation-box" id="explanationBox"></div>
      </section>
    </main>

    <footer class="footer-bar">
      <div class="timer-track">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <span class="fingers-alert" id="fingersAlert">ПАЛЬЦЫ В КАДР!</span>
      <div class="timer-digits" id="timerDigits">25</div>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'moulture_quiz_config_v2';
    const POLL_MS = 1200;

    const obs = {
      apiUrl: '',
      clockOffset: 0,
      live: {
        version: 0,
        season_name: 'Зимний кубок',
        score_valera: 0,
        score_alex: 0,
        timer_seconds: 25,
        sound_on: true,
        screen: 'standby',
        question: null,
        revealed: false,
        vabank_valera: false,
        vabank_alex: false,
        timer_status: 'stopped',
        timer_end_ts: 0,
        timer_remaining: 25,
        stats: { total: 0, used: 0, unused: 0 }
      },
      lastRenderedVersion: -1,
      lastTickSec: null,
      endChimePlayedForId: null,
      revealedChimePlayedForId: null,
      audioCtx: null
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.08) {
      if (!obs.live.sound_on) return;
      try {
        if (!obs.audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          obs.audioCtx = new Ctx();
        }
        if (obs.audioCtx.state === 'suspended') {
          obs.audioCtx.resume();
        }
        const osc = obs.audioCtx.createOscillator();
        const gain = obs.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, obs.audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, obs.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, obs.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(obs.audioCtx.destination);
        osc.start();
        osc.stop(obs.audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundTick() { playTone(660, 0.09, 'sine', 0.06); }
    function soundEnd() {
      playTone(880, 0.32, 'triangle', 0.09);
      setTimeout(() => playTone(1108.7, 0.38, 'triangle', 0.08), 90);
    }
    function soundReveal() {
      playTone(523.25, 0.16, 'sine', 0.07);
      setTimeout(() => playTone(659.25, 0.24, 'sine', 0.08), 110);
    }

    function resolveApiUrl() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = (params.get('api') || '').trim();
      if (fromUrl) {
        obs.apiUrl = fromUrl;
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          saved.apiUrl = fromUrl;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        } catch (e) {}
        return;
      }
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        obs.apiUrl = (saved.apiUrl || '').trim();
      } catch (e) {}
    }

    function renderStaticState() {
      const l = obs.live;
      $('seasonLabel').textContent = l.season_name || 'Зимний кубок';
      $('scoreValera').textContent = l.score_valera || 0;
      $('scoreAlex').textContent = l.score_alex || 0;
      $('vbPillValera').classList.toggle('active', Boolean(l.vabank_valera));
      $('vbPillAlex').classList.toggle('active', Boolean(l.vabank_alex));

      const stats = l.stats || { total: 0, used: 0, unused: 0 };
      if (!obs.apiUrl) {
        $('bankStatsText').textContent = 'Не указана ссылка ?api=... — скопируй ссылку для OBS в пульте control.html';
      } else if (stats.unused > 0) {
        $('bankStatsText').textContent = `В колоде готово вопросов: ${stats.unused} (сыграно: ${stats.used})`;
      } else {
        $('bankStatsText').textContent = 'Колода пуста — добавь вопросы через пульт управления.';
      }

      if (l.screen !== 'question' || !l.question) {
        $('standbyScreen').classList.remove('hidden');
        $('quizScreen').classList.remove('active');
        return;
      }

      $('standbyScreen').classList.add('hidden');
      $('quizScreen').classList.add('active');
      $('categoryBadge').textContent = l.question.category || 'ВИКТОРИНА';

      const qEl = $('questionText');
      const qText = l.question.question || '';
      qEl.textContent = qText;
      qEl.classList.toggle('long', qText.length > 95);

      const grid = $('optionsGrid');
      grid.innerHTML = '';

      (l.question.options || []).forEach((rawOpt, idx) => {
        const num = idx + 1;
        const parts = String(rawOpt).split('||');
        const mainText = parts[0].trim();
        const subText = parts[1] ? parts[1].trim() : '';

        const card = document.createElement('div');
        card.className = 'option-card';
        if (l.revealed) {
          if (num === Number(l.question.correct)) {
            card.classList.add('correct');
          } else {
            card.classList.add('dimmed');
          }
        }

        const mainLong = mainText.length > 42 ? ' long' : '';
        const subLong = subText.length > 52 ? ' long' : '';

        card.innerHTML = `
          <div class="option-num">${num}</div>
          <div class="option-content">
            <div class="option-main${mainLong}">${escapeHtml(mainText)}</div>
            ${subText ? `<div class="option-sub${subLong}">${escapeHtml(subText)}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });

      const exp = $('explanationBox');
      if (l.revealed && l.question.explanation) {
        exp.textContent = l.question.explanation;
        exp.classList.add('visible');
      } else {
        exp.classList.remove('visible');
      }

      if (l.revealed && l.question.id && obs.revealedChimePlayedForId !== l.question.id) {
        obs.revealedChimePlayedForId = l.question.id;
        soundReveal();
      }
    }

    function getRemainingSeconds() {
      const l = obs.live;
      if (l.screen !== 'question') {
        return Number(l.timer_seconds) || 25;
      }
      if (l.revealed) return 0;
      if (l.timer_status === 'running' && l.timer_end_ts) {
        const serverNow = Date.now() + obs.clockOffset;
        return Math.max(0, (l.timer_end_ts - serverNow) / 1000);
      }
      return Math.max(0, Number(l.timer_remaining) || 0);
    }

    function tickTimerVisual() {
      const l = obs.live;
      const total = Math.max(1, Number(l.timer_seconds) || 25);
      const rem = getRemainingSeconds();
      const ceilSec = Math.ceil(rem);
      const pct = Math.max(0, Math.min(100, (rem / total) * 100));

      $('timerFill').style.width = pct + '%';
      $('timerDigits').textContent = ceilSec;

      const isQuestionActive = l.screen === 'question' && !l.revealed;
      $('timerDigits').classList.toggle('danger', isQuestionActive && ceilSec <= 5);
      $('fingersAlert').classList.toggle('visible', isQuestionActive && rem <= 0);

      if (isQuestionActive && l.timer_status === 'running') {
        if (ceilSec <= 3 && ceilSec > 0 && obs.lastTickSec !== ceilSec) {
          obs.lastTickSec = ceilSec;
          soundTick();
        }
        const qId = l.question ? l.question.id : null;
        if (rem <= 0 && qId && obs.endChimePlayedForId !== qId) {
          obs.endChimePlayedForId = qId;
          soundEnd();
        }
      }
    }

    async function pollLoop() {
      if (!obs.apiUrl) {
        renderStaticState();
        tickTimerVisual();
        return;
      }
      try {
        const sep = obs.apiUrl.includes('?') ? '&' : '?';
        const url = `${obs.apiUrl}${sep}mode=poll&_=${Date.now()}`;
        const res = await fetch(url, { method: 'GET', redirect: 'follow' });
        const data = await res.json();
        if (data && data.ok && data.live) {
          if (data.server_now) {
            obs.clockOffset = data.server_now - Date.now();
          }
          const prevQId = obs.live.question ? obs.live.question.id : null;
          const nextQId = data.live.question ? data.live.question.id : null;
          if (prevQId !== nextQId) {
            obs.lastTickSec = null;
            obs.endChimePlayedForId = null;
          }
          obs.live = data.live;
          if (obs.live.version !== obs.lastRenderedVersion) {
            obs.lastRenderedVersion = obs.live.version;
            renderStaticState();
          }
        }
      } catch (e) {}
      setTimeout(pollLoop, POLL_MS);
    }

    resolveApiUrl();
    renderStaticState();
    tickTimerVisual();
    setInterval(tickTimerVisual, 120);
    pollLoop();
  </script>
</body>
</html>
