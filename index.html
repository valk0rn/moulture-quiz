<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Викторина!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --border: rgba(168, 184, 218, 0.45);
      --text: #f2f5fa;
      --text-muted: #c6d1e3;
      --accent: #6b5dd7;
      --accent-border: rgba(107, 93, 215, 0.85);
      --valera-score: #e5a93c;
      --teal: #4ecdc4;
      --green: #38b778;
      --red: #ff2424;
      --radius: 22px;
      --text-shadow: 0 2px 10px rgba(0, 0, 0, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.6vh 3.4vw 2.6vh;
      background: transparent !important;
      gap: 1.8vh;
    }

    /* Верхняя панель без внешних рамок */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2vw;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
    }

    .brand-title {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(26px, 2.2vw, 44px);
      font-weight: 800;
      letter-spacing: 0.01em;
      color: var(--accent);
      line-height: 1.1;
      text-shadow: var(--text-shadow);
    }

    .scoreboard {
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
      gap: 1.4vw;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 0.95vw;
    }

    .player-name {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(24px, 2vw, 40px);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
      text-shadow: var(--text-shadow);
    }

    .player-score {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(34px, 2.85vw, 58px);
      font-weight: 800;
      min-width: 2.1ch;
      text-align: center;
      padding: 0.35vh 0.85vw;
      border-radius: 14px;
      background: transparent;
      border: 2px solid var(--border);
      line-height: 1.05;
      text-shadow: var(--text-shadow);
    }

    .player-score.valera { color: var(--valera-score); }
    .player-score.alex { color: var(--teal); }

    .score-sep {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(28px, 2.3vw, 46px);
      color: var(--text-muted);
      font-weight: 700;
      text-shadow: var(--text-shadow);
    }

    .vabank-pill {
      display: none;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(15px, 1.1vw, 22px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5vh 0.9vw;
      border-radius: 999px;
      background: transparent;
      color: #ff8e8e;
      border: 2px solid rgba(224, 90, 90, 0.85);
      text-shadow: var(--text-shadow);
    }

    .vabank-pill.active {
      display: inline-block;
    }

    /* Центральная область */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .standby-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .standby-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2.4vh;
      background: transparent;
      border: none;
      padding: 2vh 2vw;
      max-width: 84vw;
    }

    .standby-title {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(60px, 6.4vw, 126px);
      font-weight: 800;
      line-height: 1.05;
      color: var(--text);
      text-shadow: var(--text-shadow);
    }

    .standby-sub {
      font-size: clamp(24px, 2.1vw, 42px);
      color: var(--text-muted);
      max-width: 68vw;
      line-height: 1.35;
      font-weight: 500;
      text-shadow: var(--text-shadow);
    }

    .standby-meta {
      margin-top: 0.8vh;
      font-size: clamp(20px, 1.45vw, 28px);
      color: var(--text-muted);
      padding: 0.8vh 1.4vw;
      background: transparent;
      border: none;
      border-radius: 14px;
      font-weight: 500;
      text-shadow: var(--text-shadow);
      max-width: 74vw;
      word-break: break-word;
    }

    .standby-meta.error {
      border: 2px solid rgba(224, 90, 90, 0.85);
      color: #ff9e9e;
    }

    /* Экран вопроса */
    .quiz-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 2vh;
      height: 100%;
    }

    .quiz-screen.active {
      display: flex;
    }

    .standby-screen.hidden {
      display: none;
    }

    .question-box {
      background: transparent;
      border: none;
      padding: 0.2vh 0;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 0;
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: 'Rubik', sans-serif;
      font-size: clamp(19px, 1.45vw, 29px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: var(--text-shadow);
    }

    .question-text {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(32px, 2.95vw, 58px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      text-shadow: var(--text-shadow);
    }

    .question-text.long {
      font-size: clamp(26px, 2.35vw, 46px);
      line-height: 1.22;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.6vh 1.5vw;
    }

    .option-card {
      display: flex;
      align-items: center;
      gap: 1.3vw;
      background: transparent;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1.85vh 1.55vw;
      min-height: 14.5vh;
      transition: all 0.28s ease;
    }

    .option-num {
      flex-shrink: 0;
      width: clamp(60px, 4.6vw, 90px);
      height: clamp(60px, 4.6vw, 90px);
      border-radius: 16px;
      background: transparent;
      border: 2px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(32px, 2.8vw, 54px);
      font-weight: 800;
      color: var(--accent);
      text-shadow: var(--text-shadow);
      transition: all 0.28s ease;
    }

    .option-content {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .option-main {
      font-size: clamp(28px, 2.55vw, 50px);
      font-weight: 700;
      line-height: 1.18;
      color: var(--text);
      word-wrap: break-word;
      text-shadow: var(--text-shadow);
    }

    .option-main.long {
      font-size: clamp(24px, 2.02vw, 40px);
      line-height: 1.2;
    }

    .option-main.very-long {
      font-size: clamp(21px, 1.72vw, 34px);
      line-height: 1.2;
    }

    .option-sub {
      font-size: clamp(22px, 1.78vw, 35px);
      color: var(--text-muted);
      line-height: 1.2;
      font-weight: 500;
      text-shadow: var(--text-shadow);
    }

    .option-sub.long {
      font-size: clamp(19px, 1.52vw, 30px);
      line-height: 1.2;
    }

    .option-sub.very-long {
      font-size: clamp(17px, 1.35vw, 26px);
      line-height: 1.2;
    }

    .option-card.correct {
      background: transparent;
      border: 3px solid var(--green);
      transform: scale(1.01);
    }

    .option-card.correct .option-num {
      background: var(--green);
      color: #0b1610;
      border-color: var(--green);
      text-shadow: none;
    }

    .option-card.dimmed {
      opacity: 0.34;
    }

    .explanation-box {
      display: none;
      background: transparent;
      border: 2px solid rgba(56, 183, 120, 0.65);
      border-left: 6px solid var(--green);
      border-radius: 16px;
      padding: 1.4vh 1.6vw;
      font-size: clamp(20px, 1.6vw, 31px);
      line-height: 1.32;
      color: #eef4fc;
      text-shadow: var(--text-shadow);
      animation: fadeIn 0.3s ease;
    }

    .explanation-box.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Нижняя полоса таймера во всю ширину без внешней плашки */
    .footer-bar {
      display: flex;
      align-items: center;
      gap: 1.6vw;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    .timer-track {
      flex: 1;
      height: 22px;
      background: transparent;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid var(--border);
      transition: border-color 0.2s ease;
    }

    .timer-track.expired {
      border-color: var(--red);
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.06s linear;
    }

    .timer-digits {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(32px, 2.6vw, 52px);
      font-weight: 800;
      min-width: 2.3ch;
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: var(--text-shadow);
    }

    .fingers-alert {
      display: none;
      font-family: 'Rubik', sans-serif;
      font-size: clamp(24px, 1.95vw, 38px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--red);
      text-shadow: var(--text-shadow);
      animation: pulse 0.75s infinite alternate;
      white-space: nowrap;
    }

    .fingers-alert.visible {
      display: inline-block;
    }

    @keyframes pulse {
      from { opacity: 0.65; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="topbar">
      <div class="brand-pill">
        <div class="brand-title">Викторина • <span id="seasonLabel">Зимний кубок</span></div>
      </div>

      <div class="scoreboard">
        <div class="player">
          <span class="vabank-pill" id="vbPillValera">Ва-банк</span>
          <span class="player-name">Валерий</span>
          <span class="player-score valera" id="scoreValera">0</span>
        </div>
        <span class="score-sep">:</span>
        <div class="player">
          <span class="player-score alex" id="scoreAlex">0</span>
          <span class="player-name">Алекс</span>
          <span class="vabank-pill" id="vbPillAlex">Ва-банк</span>
        </div>
      </div>
    </header>

    <main class="main-area">
      <section class="standby-screen" id="standbyScreen">
        <div class="standby-card">
          <h1 class="standby-title">Викторина!</h1>
          <p class="standby-sub">Четыре варианта, один таймер и одновременный ответ в камеру.</p>
          <div class="standby-meta" id="bankStatsText">Подключение к таблице...</div>
        </div>
      </section>

      <section class="quiz-screen" id="quizScreen">
        <div class="question-box">
          <div class="question-header">
            <span class="category-badge" id="categoryBadge">ВИКТОРИНА</span>
          </div>
          <h2 class="question-text" id="questionText"></h2>
        </div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="explanation-box" id="explanationBox"></div>
      </section>
    </main>

    <footer class="footer-bar">
      <div class="timer-track" id="timerTrack">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <span class="fingers-alert" id="fingersAlert">КАРТОЧКИ В КАДР!</span>
      <div class="timer-digits" id="timerDigits">25</div>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'moulture_quiz_config_v2';
    const POLL_MS = 2000;

    const obs = {
      apiUrl: '',
      clockOffset: 0,
      connectedOnce: false,
      initialized: false,
      connError: '',
      errorCount: 0,
      live: {
        version: 0,
        season_name: 'Зимний кубок',
        score_valera: 0,
        score_alex: 0,
        timer_seconds: 25,
        sound_on: true,
        screen: 'standby',
        question: null,
        revealed: false,
        vabank_valera: false,
        vabank_alex: false,
        timer_status: 'stopped',
        timer_end_ts: 0,
        timer_remaining: 25,
        stats: { total: 0, used: 0, unused: 0 }
      },
      lastRenderedVersion: -1,
      lastStartKey: null,
      lastTickKey: null,
      lastGongKey: null,
      revealedChimePlayedForId: null,
      audioCtx: null
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* Плавный градиент таймера: от базового #6b5dd7 к ярко-красному #ff1a1a */
    function timerBarColorAt(t) {
      const p = Math.max(0, Math.min(1, t));
      const h = 246.9 + (360 - 246.9) * p;
      const s = 60.4 + (100 - 60.4) * p;
      const l = 60.4 + (53 - 60.4) * p;
      return `hsl(${h.toFixed(1)}, ${s.toFixed(1)}%, ${l.toFixed(1)}%)`;
    }

    /* Плавный переход цвета цифр таймера от базового белого к ярко-красному (#ff2424) */
    function timerDigitsColorAt(t) {
      const p = Math.pow(Math.max(0, Math.min(1, t)), 1.35);
      const r = Math.round(242 + (255 - 242) * p);
      const g = Math.round(245 + (36 - 245) * p);
      const b = Math.round(250 + (36 - 250) * p);
      return `rgb(${r}, ${g}, ${b})`;
    }

    /* Аудиодвижок (Web Audio API) */
    function getAudioCtx() {
      if (!obs.live.sound_on) return null;
      try {
        if (!obs.audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          obs.audioCtx = new Ctx();
        }
        if (obs.audioCtx.state === 'suspended') {
          obs.audioCtx.resume();
        }
        return obs.audioCtx;
      } catch (e) {
        return null;
      }
    }

    /* 1. Сигнал начала отсчета времени */
    function soundCountdownStart() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const notes = [587.33, 880.0];

      notes.forEach((freq, idx) => {
        const t = now + idx * 0.085;
        const osc = ctx.createOscillator();
        const overtone = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        overtone.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        overtone.frequency.setValueAtTime(freq * 2, t);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.11, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

        const ovGain = ctx.createGain();
        ovGain.gain.setValueAtTime(0.035, t);
        ovGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

        osc.connect(gain);
        overtone.connect(ovGain);
        ovGain.connect(gain);
        gain.connect(ctx.destination);

        osc.start(t);
        overtone.start(t);
        osc.stop(t + 0.3);
        overtone.stop(t + 0.18);
      });
    }

    /* 2. Нарастающий сигнал каждой секунды из последних 10 (10 -> 1) */
    function soundCountdownTick(sec) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const step = Math.max(0, Math.min(9, 10 - sec));
      const baseFreq = 520 * Math.pow(1.095, step);
      const sharpness = step / 9;

      const oscMain = ctx.createOscillator();
      const oscSharp = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const mainGain = ctx.createGain();
      const sharpGain = ctx.createGain();
      const master = ctx.createGain();

      oscMain.type = step < 5 ? 'triangle' : 'sawtooth';
      oscSharp.type = 'square';

      oscMain.frequency.setValueAtTime(baseFreq, now);
      oscSharp.frequency.setValueAtTime(baseFreq * 2, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400 + sharpness * 4200, now);
      filter.Q.setValueAtTime(1.5 + sharpness * 4.5, now);

      const peak = 0.065 + sharpness * 0.05;
      const dur = 0.115 - sharpness * 0.02;

      mainGain.gain.setValueAtTime(1.0, now);
      sharpGain.gain.setValueAtTime(0.08 + sharpness * 0.28, now);

      master.gain.setValueAtTime(0.0001, now);
      master.gain.linearRampToValueAtTime(peak, now + 0.006);
      master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      oscMain.connect(mainGain);
      oscSharp.connect(sharpGain);
      mainGain.connect(filter);
      sharpGain.connect(filter);
      filter.connect(master);
      master.connect(ctx.destination);

      oscMain.start(now);
      oscSharp.start(now);
      oscMain.stop(now + dur + 0.02);
      oscSharp.stop(now + dur + 0.02);
    }

    /* 3. Металлический гонг на отметке 0 */
    function soundGong() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      const master = ctx.createGain();
      master.gain.setValueAtTime(0.85, now);
      master.connect(ctx.destination);

      const fundamental = 156;
      const partials = [
        { ratio: 1.00, detune: 0,    amp: 0.24, decay: 2.8, type: 'sine',     delay: 0 },
        { ratio: 1.00, detune: 14,   amp: 0.18, decay: 2.6, type: 'sine',     delay: 0.015 },
        { ratio: 1.49, detune: -8,   amp: 0.14, decay: 2.3, type: 'triangle', delay: 0.01 },
        { ratio: 2.02, detune: 11,   amp: 0.12, decay: 2.0, type: 'sine',     delay: 0.02 },
        { ratio: 2.74, detune: -12,  amp: 0.09, decay: 1.6, type: 'triangle', delay: 0.025 },
        { ratio: 3.41, detune: 9,    amp: 0.07, decay: 1.3, type: 'sine',     delay: 0.03 },
        { ratio: 4.19, detune: -7,   amp: 0.05, decay: 1.0, type: 'sine',     delay: 0.01 },
        { ratio: 5.38, detune: 15,   amp: 0.035,decay: 0.75,type: 'sine',     delay: 0 }
      ];

      partials.forEach((p) => {
        const t = now + p.delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = p.type;
        osc.frequency.setValueAtTime(fundamental * p.ratio, t);
        osc.detune.setValueAtTime(p.detune, t);
        osc.frequency.exponentialRampToValueAtTime(fundamental * p.ratio * 0.992, t + p.decay);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(p.amp, t + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + p.decay);

        osc.connect(gain);
        gain.connect(master);
        osc.start(t);
        osc.stop(t + p.decay + 0.05);
      });

      const bufSize = Math.floor(ctx.sampleRate * 0.35);
      const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.08));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(850, now);
      bp.Q.setValueAtTime(1.2, now);
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(0.18, now);
      nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

      noise.connect(bp);
      bp.connect(nGain);
      nGain.connect(master);
      noise.start(now);
      noise.stop(now + 0.35);
    }

    /* 4. Короткий джингл с эхом при показе правильного ответа */
    function soundRevealJingle() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      const dryBus = ctx.createGain();
      const wetInput = ctx.createGain();
      const delay = ctx.createDelay(1.0);
      const feedback = ctx.createGain();
      const echoFilter = ctx.createBiquadFilter();
      const wetOut = ctx.createGain();

      dryBus.gain.setValueAtTime(0.85, now);
      wetInput.gain.setValueAtTime(0.65, now);
      delay.delayTime.setValueAtTime(0.21, now);
      feedback.gain.setValueAtTime(0.42, now);
      echoFilter.type = 'lowpass';
      echoFilter.frequency.setValueAtTime(2200, now);
      wetOut.gain.setValueAtTime(0.55, now);

      dryBus.connect(ctx.destination);
      wetInput.connect(delay);
      delay.connect(echoFilter);
      echoFilter.connect(wetOut);
      wetOut.connect(ctx.destination);
      echoFilter.connect(feedback);
      feedback.connect(delay);

      const notes = [
        { freq: 523.25, offset: 0.00, dur: 0.24, vol: 0.11 },
        { freq: 659.25, offset: 0.075, dur: 0.24, vol: 0.11 },
        { freq: 783.99, offset: 0.15, dur: 0.28, vol: 0.12 },
        { freq: 1046.50, offset: 0.23, dur: 0.52, vol: 0.14 }
      ];

      notes.forEach((n) => {
        const t = now + n.offset;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const env = ctx.createGain();
        const ovEnv = ctx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(n.freq, t);
        osc2.frequency.setValueAtTime(n.freq * 2, t);

        env.gain.setValueAtTime(0.0001, t);
        env.gain.linearRampToValueAtTime(n.vol, t + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);

        ovEnv.gain.setValueAtTime(n.vol * 0.3, t);
        ovEnv.gain.exponentialRampToValueAtTime(0.0001, t + n.dur * 0.65);

        osc1.connect(env);
        osc2.connect(ovEnv);
        ovEnv.connect(env);
        env.connect(dryBus);
        env.connect(wetInput);

        osc1.start(t);
        osc2.start(t);
        osc1.stop(t + n.dur + 0.04);
        osc2.stop(t + n.dur + 0.04);
      });
    }

    function resolveApiUrl() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = (params.get('api') || '').trim();
      if (fromUrl) {
        obs.apiUrl = fromUrl;
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          saved.apiUrl = fromUrl;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        } catch (e) {}
        return;
      }
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        obs.apiUrl = (saved.apiUrl || '').trim();
      } catch (e) {}
    }

    function renderBankStatus() {
      const el = $('bankStatsText');
      const stats = obs.live.stats || { total: 0, used: 0, unused: 0 };

      if (!obs.apiUrl) {
        el.classList.add('error');
        el.textContent = 'Не указана ссылка ?api=... — скопируй ссылку для OBS в пульте control.html';
        return;
      }

      if (obs.connError) {
        el.classList.add('error');
        el.textContent = obs.connError;
        return;
      }

      el.classList.remove('error');
      if (!obs.connectedOnce) {
        el.textContent = 'Подключение к таблице...';
      } else if (stats.unused > 0) {
        el.textContent = `В колоде готово вопросов: ${stats.unused} (сыграно: ${stats.used})`;
      } else {
        el.textContent = 'Колода пуста — добавь вопросы через пульт управления.';
      }
    }

    function getSizeClass(text, longLen, veryLongLen) {
      if (text.length > veryLongLen) return ' very-long';
      if (text.length > longLen) return ' long';
      return '';
    }

    function renderStaticState() {
      const l = obs.live;
      $('seasonLabel').textContent = l.season_name || 'Зимний кубок';
      $('scoreValera').textContent = l.score_valera || 0;
      $('scoreAlex').textContent = l.score_alex || 0;
      $('vbPillValera').classList.toggle('active', Boolean(l.vabank_valera));
      $('vbPillAlex').classList.toggle('active', Boolean(l.vabank_alex));

      renderBankStatus();

      if (l.screen !== 'question' || !l.question) {
        $('standbyScreen').classList.remove('hidden');
        $('quizScreen').classList.remove('active');
        return;
      }

      $('standbyScreen').classList.add('hidden');
      $('quizScreen').classList.add('active');
      $('categoryBadge').textContent = l.question.category || 'ВИКТОРИНА';

      const qEl = $('questionText');
      const qText = l.question.question || '';
      qEl.textContent = qText;
      qEl.classList.toggle('long', qText.length > 92);

      const grid = $('optionsGrid');
      grid.innerHTML = '';

      (l.question.options || []).forEach((rawOpt, idx) => {
        const num = idx + 1;
        const parts = String(rawOpt).split('||');
        const mainText = parts[0].trim();
        const subText = parts[1] ? parts[1].trim() : '';

        const card = document.createElement('div');
        card.className = 'option-card';
        if (l.revealed) {
          if (num === Number(l.question.correct)) {
            card.classList.add('correct');
          } else {
            card.classList.add('dimmed');
          }
        }

        const mainSize = getSizeClass(mainText, 36, 72);
        const subSize = getSizeClass(subText, 46, 82);

        card.innerHTML = `
          <div class="option-num">${num}</div>
          <div class="option-content">
            <div class="option-main${mainSize}">${escapeHtml(mainText)}</div>
            ${subText ? `<div class="option-sub${subSize}">${escapeHtml(subText)}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });

      const exp = $('explanationBox');
      if (l.revealed && l.question.explanation) {
        exp.textContent = l.question.explanation;
        exp.classList.add('visible');
      } else {
        exp.classList.remove('visible');
      }

      if (l.revealed && l.question.id && obs.revealedChimePlayedForId !== l.question.id) {
        obs.revealedChimePlayedForId = l.question.id;
        soundRevealJingle();
      }
    }

    function getRemainingSeconds() {
      const l = obs.live;
      if (l.screen !== 'question') {
        return Number(l.timer_seconds) || 25;
      }
      if (l.revealed) return 0;
      if (l.timer_status === 'running' && l.timer_end_ts) {
        const serverNow = Date.now() + obs.clockOffset;
        return Math.max(0, (l.timer_end_ts - serverNow) / 1000);
      }
      return Math.max(0, Number(l.timer_remaining) || 0);
    }

    function tickTimerVisual() {
      const l = obs.live;
      const total = Math.max(1, Number(l.timer_seconds) || 25);
      const rem = getRemainingSeconds();
      const ceilSec = Math.ceil(rem);
      const pct = Math.max(0, Math.min(100, (rem / total) * 100));

      const isQuestionActive = l.screen === 'question' && !l.revealed;
      const progress = isQuestionActive ? Math.max(0, Math.min(1, 1 - (rem / total))) : 0;
      const timeUp = isQuestionActive && rem <= 0;

      const fillEl = $('timerFill');
      const trackEl = $('timerTrack');
      const digitsEl = $('timerDigits');

      fillEl.style.width = pct + '%';
      trackEl.classList.toggle('expired', timeUp);

      if (isQuestionActive) {
        const spread = Math.sin(progress * Math.PI);
        const pLeft = Math.max(0, progress - 0.16 * spread);
        const pRight = Math.min(1, progress + 0.14 * spread);
        fillEl.style.background = `linear-gradient(90deg, ${timerBarColorAt(pLeft)}, ${timerBarColorAt(pRight)})`;
        digitsEl.style.color = timerDigitsColorAt(progress);
      } else {
        fillEl.style.background = 'var(--accent)';
        digitsEl.style.color = '';
      }

      digitsEl.textContent = ceilSec;
      $('fingersAlert').classList.toggle('visible', timeUp);

      if (isQuestionActive && l.timer_status === 'running' && l.question && l.timer_end_ts) {
        const runKey = `${l.question.id}_${l.timer_end_ts}`;

        if (obs.lastStartKey !== runKey) {
          obs.lastStartKey = runKey;
          if (rem > 10 || rem >= total - 3) {
            soundCountdownStart();
          }
        }

        if (ceilSec <= 10 && ceilSec >= 1) {
          const tickKey = `${runKey}_${ceilSec}`;
          if (obs.lastTickKey !== tickKey) {
            obs.lastTickKey = tickKey;
            soundCountdownTick(ceilSec);
          }
        }

        if (rem <= 0 && obs.lastGongKey !== runKey) {
          obs.lastGongKey = runKey;
          soundGong();
        }
      }
    }

    /* Обходная загрузка через JSONP (щадящий режим без дублирующих штормов запросов) */
    function pollViaJsonp(url, timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const cbName = '__mqCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        let settled = false;

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          const err = new Error('Таймаут ответа от script.google.com');
          err.isTimeout = true;
          reject(err);
        }, timeoutMs);

        window[cbName] = (data) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(data);
        };

        script.onload = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Сервер вернул не JSONP (проверь обновление apps-script.js)'));
        };

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Не удалось загрузить данные (проверь URL ?api=... и доступ OBS к сети)'));
        };

        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}mode=poll&callback=${encodeURIComponent(cbName)}&_=${Date.now()}`;
        script.async = true;
        document.head.appendChild(script);
      });
    }

    async function pollViaFetch(url) {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}mode=poll&_=${Date.now()}`, { method: 'GET', redirect: 'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function pollOnce() {
      try {
        return await pollViaJsonp(obs.apiUrl);
      } catch (jsonpErr) {
        if (jsonpErr && jsonpErr.isTimeout) {
          throw jsonpErr;
        }
        try {
          return await pollViaFetch(obs.apiUrl);
        } catch (fetchErr) {
          throw new Error(`Ошибка связи: ${jsonpErr.message}`);
        }
      }
    }

    async function pollLoop() {
      if (!obs.apiUrl) {
        renderStaticState();
        tickTimerVisual();
        return;
      }
      try {
        const data = await pollOnce();
        if (data && data.ok && data.live) {
          obs.connectedOnce = true;
          obs.connError = '';
          obs.errorCount = 0;
          if (data.server_now) {
            obs.clockOffset = data.server_now - Date.now();
          }

          const nextLive = data.live;

          if (!obs.initialized) {
            obs.initialized = true;
            if (nextLive.question && nextLive.revealed) {
              obs.revealedChimePlayedForId = nextLive.question.id;
            }
            if (nextLive.question && nextLive.timer_end_ts) {
              const serverNow = Date.now() + obs.clockOffset;
              const remOnLoad = (nextLive.timer_end_ts - serverNow) / 1000;
              const runKey = `${nextLive.question.id}_${nextLive.timer_end_ts}`;
              if (remOnLoad <= 0) {
                obs.lastGongKey = runKey;
                obs.lastStartKey = runKey;
              } else if (remOnLoad < (Number(nextLive.timer_seconds) || 25) - 3) {
                obs.lastStartKey = runKey;
              }
            }
          }

          obs.live = nextLive;
          if (obs.live.version !== obs.lastRenderedVersion) {
            obs.lastRenderedVersion = obs.live.version;
            renderStaticState();
          } else {
            renderBankStatus();
          }
        } else {
          obs.errorCount++;
          obs.connError = 'Ошибка таблицы: ' + ((data && data.error) ? data.error : 'пустой ответ');
          renderBankStatus();
        }
      } catch (err) {
        obs.errorCount++;
        obs.connError = err.message || 'Ошибка подключения к таблице';
        renderBankStatus();
      }
      const nextDelay = obs.errorCount > 0 ? Math.min(8000, POLL_MS * (obs.errorCount + 1)) : POLL_MS;
      setTimeout(pollLoop, nextDelay);
    }

    resolveApiUrl();
    renderStaticState();
    tickTimerVisual();
    setInterval(tickTimerVisual, 50);
    pollLoop();
  </script>
</body>
</html>
